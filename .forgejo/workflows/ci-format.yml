name: Format
on:
  push:
    branches: [master, main, 'ccr-**']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_PROCESSOR_COUNT: '2'
  SDK_VERSION: "10.0.x"

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: .NET SDK installeren
        env:
          SDK_KANAAL: ${{ env.SDK_VERSION }}
        run: bash tools/jelly-leon/installeer_dotnet.sh "$SDK_KANAAL"

      - name: Run DotNet Format
        run: dotnet format --verify-no-changes --verbosity minimal
