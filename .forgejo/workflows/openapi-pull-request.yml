name: OpenAPI Check
on:
  pull_request:

jobs:
  ancestor:
    name: Common Ancestor
    runs-on: ubuntu-latest
    outputs:
      base_ref: ${{ steps.ancestor.outputs.base_ref }}
    steps:
    - name: Checkout Repository
      uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        fetch-depth: 0
    - name: Search History
      id: ancestor
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git fetch --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BASE_SHA"
        ancestor=$(git merge-base FETCH_HEAD HEAD)
        echo "base_ref=$ancestor" >> "$GITHUB_OUTPUT"

  head:
    name: Head Artifact
    uses: ./.forgejo/workflows/openapi-generate.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      artifact: openapi-head

  base:
    name: Base Artifact
    uses: ./.forgejo/workflows/openapi-generate.yml
    needs:
    - ancestor
    with:
      ref: ${{ needs.ancestor.outputs.base_ref }}
      repository: ${{ github.event.pull_request.base.repo.full_name }}
      artifact: openapi-base

  diff:
    name: Generate Report
    runs-on: ubuntu-latest
    needs:
    - head
    - base
    steps:
    - name: Download Head
      uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e
      with:
        name: openapi-head
        path: openapi-head
    - name: Download Base
      uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e
      with:
        name: openapi-base
        path: openapi-base
    - name: Detect Changes
      id: openapi-diff
      run: |
        sed -i 's:allOf:oneOf:g' openapi-head/openapi.json
        sed -i 's:allOf:oneOf:g' openapi-base/openapi.json

        report="$RUNNER_TEMP/openapi-report.md"
        container=$(docker create --network none openapitools/openapi-diff:2.1.6 \
          /base.json /head.json --state -l ERROR --markdown /openapi-report.md)
        trap 'docker rm -fv "$container" >/dev/null' EXIT
        docker cp openapi-base/openapi.json "$container:/base.json"
        docker cp openapi-head/openapi.json "$container:/head.json"
        docker start -a "$container"
        test "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = 0
        docker cp "$container:/openapi-report.md" "$report"
    - name: Upload Artifact
      uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
      with:
        name: openapi-report
        path: ${{ runner.temp }}/openapi-report.md
        if-no-files-found: error
