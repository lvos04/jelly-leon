name: Tests
on:
  push:
    branches: [master, main, 'ccr-**']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_PROCESSOR_COUNT: '2'
  SDK_VERSION: "10.0.x"

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: https://data.forgejo.org/actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Run DotNet CLI Tests
        run: >
          dotnet test Jellyfin.sln
          --configuration Release
          --collect:"XPlat Code Coverage"
          --settings tests/coverletArgs.runsettings
          --verbosity minimal

      - name: Dekkingsrapporten samenvoegen
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/dekking" dotnet-reportgenerator-globaltool --version 5.5.11
          "$RUNNER_TEMP/dekking/reportgenerator" '-reports:**/coverage.cobertura.xml' '-targetdir:merged' '-reporttypes:Cobertura'

      - name: Cobertura-rapport bewaren
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: dekking-linux
          path: merged/Cobertura.xml
          if-no-files-found: error
