name: ABI Compatibility
on:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_PROCESSOR_COUNT: '2'

jobs:
  abi-head:
    name: ABI - HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup .NET
        uses: https://data.forgejo.org/actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: |
          dotnet build Jellyfin.Server -o ./out

      - name: Upload Head
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: abi-head
          retention-days: 14
          if-no-files-found: error
          path: out/

  abi-base:
    name: ABI - BASE
    if: ${{ github.base_ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: https://data.forgejo.org/actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Checkout common ancestor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BASE_SHA"
          ancestor=$(git merge-base FETCH_HEAD HEAD)
          git checkout --detach "$ancestor"

      - name: Build
        run: |
          dotnet build Jellyfin.Server -o ./out

      - name: Upload Head
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: abi-base
          retention-days: 14
          if-no-files-found: error
          path: out/

  abi-diff:
    name: ABI - Difference
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - abi-head
      - abi-base

    steps:
      - name: Download abi-head
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e
        with:
          name: abi-head
          path: abi-head

      - name: Download abi-base
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e
        with:
          name: abi-base
          path: abi-base

      - name: .NET SDK
        uses: https://data.forgejo.org/actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: ApiCompat installeren
        run: dotnet tool install --tool-path "$RUNNER_TEMP/abi" Microsoft.DotNet.ApiCompat.Tool

      - name: Publieke API van de assemblies vergelijken
        run: |
          report="$RUNNER_TEMP/abi-diff.txt"
          for dll in Jellyfin.Data MediaBrowser.Common MediaBrowser.Controller MediaBrowser.Model Emby.Naming Jellyfin.Extensions Jellyfin.MediaEncoding.Keyframes Jellyfin.Database.Implementations; do
            test -s "abi-base/$dll.dll" && test -s "abi-head/$dll.dll" || exit 1
            echo "$dll" >> "$report"
            # ApiCompat retourneert ook bij een gevonden ABI-verschil een afwijkende exitcode.
            "$RUNNER_TEMP/abi/apicompat" --left "abi-base/$dll.dll" --right "abi-head/$dll.dll" > "$RUNNER_TEMP/assembly.txt" 2>&1 || {
              rc=$?
              if ! grep -Eq 'CP[0-9]{4}' "$RUNNER_TEMP/assembly.txt"; then cat "$RUNNER_TEMP/assembly.txt"; exit "$rc"; fi
            }
            cat "$RUNNER_TEMP/assembly.txt" >> "$report"
          done
          cat "$report"

      - name: ABI-rapport bewaren
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: abi-diff
          path: ${{ runner.temp }}/abi-diff.txt
          if-no-files-found: error
