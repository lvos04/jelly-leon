name: OpenAPI Generate

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      repository:
        required: true
        type: string
      artifact:
        required: true
        type: string

env:
  DOTNET_PROCESSOR_COUNT: '2'

permissions:
  contents: read

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    steps:
    - name: CI-instructies uit de workflowrevisie ophalen
      uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.base.sha || github.sha }}
        path: _ci
        sparse-checkout: tools/jelly-leon/installeer_dotnet.sh
        sparse-checkout-cone-mode: false

    - name: Configure .NET
      env:
        SDK_KANAAL: '10.0.x'
      run: bash _ci/tools/jelly-leon/installeer_dotnet.sh "$SDK_KANAAL"

    - name: Checkout Repository
      uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.ref }}
        repository: ${{ inputs.repository }}

    # De testprogramma’s moeten kunnen starten; de checkout van de runner is noexec.
    - name: Testbron op het uitvoerbare jobvolume plaatsen
      run: git worktree add --quiet --detach "$RUNNER_TEMP/testbron" HEAD

    - name: Create File
      run: |
        cd "$RUNNER_TEMP/testbron"
        dotnet test tests/Jellyfin.Server.Integration.Tests/Jellyfin.Server.Integration.Tests.csproj -c Release --filter Jellyfin.Server.Integration.Tests.OpenApiSpecTests

    - name: Upload Artifact
      uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/testbron/tests/Jellyfin.Server.Integration.Tests/bin/Release/net10.0/openapi.json
        retention-days: 14
        if-no-files-found: error
