# Manifest (manifeststandaard v1, platformcontract 1.2 §9) van de Jelly Leon-mediaserver.
# Installatie uitsluitend als standaard TrueNAS Custom App (één image + formulierwaarden); nooit compose/YAML.
# Er bestaat nog GEEN gepubliceerde image: fork_version -jl.0 wordt nooit uitgebracht (ADR-0005). De release-CI
# vult tag + digest bij de eerste release (na de upgrade naar 12.x, ADR-0011). Tot dan is installeren niet mogelijk
# (validator: digest_pending_release; validation_status unvalidated).
# Alle paden, poorten en apparaten komen uit de wizard/datasetkiezer of gemeten TrueNAS-readback — nooit voorbeeldwaarden.
# Contract 1.2: poorten staan alleen in network.ports (custom_app.ports en network.joins_platform_network vervallen);
# GPU is een optionele wizardparameter (D08), privileges.gpu is het maximum (ADR-0012).
manifest_version: "1"
app_id: jelly-leon
name: Jelly Leon
owner_repo: lvos04/jelly-leon
category: media
description_nl: >-
  Mediaserver voor film, series, anime, muziek en live-tv, gebaseerd op Jellyfin (GPL-2.0). De technische identiteit
  blijft "Jellyfin", zodat bestaande Jellyfin-apps blijven werken; de zichtbare naam is Jelly Leon. Server, web-client
  en de Jelly Leon-plugin zitten in één image.
version: "10.11.11-jl.0"
install:
  method: custom_app
image:
  repository: ghcr.io/lvos04/jelly-leon
  tag: "10.11.11-jl.0"
  digest: null
custom_app:
  # Geen ports hier (vervallen in contract 1.2 §9): de formulierpoorten komen uit network.ports.
  storage:
    - name: config
      type: host_path
      host_path: {param: config_path}
    - name: cache
      type: host_path
      host_path: {param: cache_path}
    - name: media
      type: host_path
      host_path: {param: media_path}
      read_only: true
  env: []
  resources:
    cpus: 4
    memory_mib: 4096
  # GPU is optioneel en standaard UIT (least privilege): de wizard biedt intel_render alleen aan als D08 via de
  # TrueNAS-API een render-node heeft gemeten; zonder waarde → none. Begrensd door privileges.gpu (ADR-0012).
  gpu: {param: gpu}
  run_as:
    mode: image_default
  timezone: {param: timezone}
  restart_policy: unless-stopped
  portal:
    port: web
    scheme: http
    path: /
    name: Jelly Leon
parameters:
  - name: host_port
    type: port
    source: default
    default: 30460
    required: true
    description_nl: >-
      Hostpoort; voorstel uit het platformcontract (§2). Staat er al een stock-Jellyfin (D07 meet dat via de
      TrueNAS-API), dan blijft die ongemoeid op zijn eigen poort (I24 stap 4: aparte poort, geen vervanging). De Hub
      controleert vóór installatie op conflicten.
  - name: gpu
    type: gpu
    source: wizard
    decision: D08
    required: false
    description_nl: >-
      Intel-GPU voor hardware-transcodering (QSV/VAAPI). Alleen kiesbaar als de wizard via de TrueNAS-API een
      render-node heeft gemeten (D08); anders en zonder keuze: none (transcoderen via de CPU). Het formulier geeft dan
      elke niet-NVIDIA-render-GPU door (use_all_gpus); één specifieke render-node kiezen kan het formulier niet.
  - name: config_path
    type: path
    source: dataset_picker
    dataset_role: jelly_leon_config
    decision: D02
    required: true
    description_nl: Eigen dataset voor /config (SQLite-database, metadata, plugins, gebruikers). Nooit de config van de bestaande Jellyfin.
  - name: cache_path
    type: path
    source: dataset_picker
    dataset_role: jelly_leon_cache
    decision: D02
    required: true
    description_nl: Dataset voor /cache (transcodes, afbeeldingen); mag zonder back-up.
  - name: media_path
    type: path
    source: dataset_picker
    dataset_role: media_library
    decision: D02
    required: true
    description_nl: Mediadataset, ALLEEN LEZEN gemount op /media. Bestandsbeheer blijft bij MediaGuard/MSO.
  - name: timezone
    type: timezone
    source: wizard
    required: true
    description_nl: Tijdzone van de NAS, gemeten of bevestigd in de onboarding-wizard.
  - name: rpo
    type: duration
    source: wizard
    decision: D16
    required: false
    description_nl: Maximaal toegestaan dataverlies (RPO), vastgelegd in de wizard (D16).
  - name: rto
    type: duration
    source: wizard
    decision: D16
    required: false
    description_nl: Maximaal toegestane hersteltijd (RTO), vastgelegd in de wizard (D16).
storage:
  - name: config
    mount: /config
    kind: config
    required_dataset_role: jelly_leon_config
    description_nl: Jellyfin-datamap (SQLite jellyfin.db, metadata, plugins). Contractafwijking /appdata → /config, zie ADR-0008.
  - name: cache
    mount: /cache
    kind: scratch
    required_dataset_role: jelly_leon_cache
    description_nl: Cache en transcodes; opnieuw op te bouwen.
  - name: media
    mount: /media
    kind: media
    required_dataset_role: media_library
    description_nl: Mediabibliotheek, alleen lezen.
network:
  ports:
    - name: web
      container_port: 8096
      host_port: {param: host_port}
      protocol: tcp
      purpose_nl: Jellyfin-API, web-client en streaming
  host_network: false
  host_network_reason: null
privileges:
  privileged: false
  cap_add: []
  devices: []
  # Maximum: de app mag hooguit een Intel-render-GPU krijgen; of hij die krijgt, bepaalt de gpu-parameter (D08).
  gpu: intel_render
privilege_reason: >-
  Optioneel een Intel-render-GPU (/dev/dri) voor hardware-transcodering (QSV/VAAPI) via jellyfin-ffmpeg, alleen als
  de wizard een render-node heeft gemeten (D08) en de gebruiker hem kiest; standaard none. Nooit privileged, geen
  extra capabilities, geen losse apparaten: de entrypoint voegt alleen de groep van de doorgegeven
  /dev/dri/renderD*-node toe (nooit groep 0). De container start als root uitsluitend om /config en /cache aan
  568:568 te geven en draait daarna als 568 zonder capabilities, met no_new_privs.
healthcheck:
  type: http
  path: /health
  port: web
  interval_s: 30
  timeout_s: 10
  retries: 3
backup:
  db_export:
    method: app_native
    description_nl: >-
      Jellyfin 10.11 heeft een eigen back-up-API (/Backup, alleen beheerder) die de database en metadata exporteert;
      daarnaast ZFS-snapshot van de config-dataset. Herstel van database + binary samen (B03-013).
  snapshot_datasets: [config]
  rpo: {param: rpo}
  rto: {param: rto}
dependencies:
  - app_id: ai-server-manager
    kind: optional
    reason_nl: Versie-/compatibiliteitspagina en lifecycle via de Hub; zonder Hub werkt de mediaserver zelfstandig.
  - app_id: jelly-leon-platform
    kind: optional
    reason_nl: Lifecycle (staging, canary, terugzetten) van deze app.
sso: native
risk:
  install: R2
  update: R2
  uninstall: R2
upgrade:
  migrations: true
  tag_only_rollback_safe: false
  notes_nl: >-
    Jellyfin migreert de SQLite-database bij de start. Terug naar een oudere tag alleen samen met de database-back-up of
    snapshot van vóór de update (database + binary samen, B03-013/I06 stap 8).
decisions_required: [D01, D02, D03, D07, D08, D15, D16]
docs: [B03_UNIVERSELE_MEDIASERVER, I06_JELLYFIN, I24_UNIVERSELE_MEDIASERVER, A17_JELLYFIN]
validation_status: unvalidated
compatibility:
  # Platformminimum voor de standaard Custom App (ix-app met values), gelijk aan de andere platformapps;
  # de echte NAS-versie (D01) meet de wizard.
  truenas_min_version: "24.10.2.2"
  truenas_max_version: null
  ix_app_min_version: "1.2.0"
provenance:
  source_repo: https://github.com/lvos04/jelly-leon
  source_commit: null
  upstream_repo: https://github.com/jellyfin/jellyfin
  license: GPL-2.0
