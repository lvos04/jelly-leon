# Lint voor het B03-016-harnas (tools/b03-harnas); zelfde regels als de forktools.
extend = "../jelly-leon/ruff.toml"

[lint]
# N818: fouttypen heten Nederlands (…Fout), zoals in de andere forktools.
# S311: random.Random met vaste seed is hier bewust (reproduceerbare recepten en bootstrap), nooit voor geheimen.
