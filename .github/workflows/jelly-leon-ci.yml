# Jelly Leon CI — bouwt en test de upstream-solution én de fork-eigen plugins, bewaakt de forkregels
# (patchregister, versieconsistentie, OpenAPI-drift, lint), bouwt de alles-in-één image en test de levenscyclus
# (lege opslag → healthy → herstart zonder dataverlies), de terugzetproef (upstream → Jelly Leon → terug met
# DB-back-up + oude binary, B03-013) en draait de stock-client-smoketest (simulator).
# Deze workflow publiceert niets: geen image-push, geen release, geen deploy.
# Upstream-workflows (ci-tests.yml e.a.) blijven bestaan; zie docs/adr/ADR-0007 voor wat er in de fork draait.
name: Jelly Leon CI

on:
  push:
    branches:
      - main
      - 'ccr-**'
      - 'sync/**'
      - 'release/**'
    tags:
      - 'v*-jl.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jelly-leon-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # Officiële upstream-runtime (jellyfin-ffmpeg + Intel-stack), op digest vastgezet; zelfde als deploy/allinone.
  JL_RUNTIME_IMAGE: docker.io/jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db

jobs:
  forkregels:
    name: Forkregels (patchregister, versies, tool-tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (volledige historie voor de upstream-basis)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Testafhankelijkheden
        run: python -m pip install --disable-pip-version-check -r tools/jelly-leon/requirements-dev.txt

      - name: Versie- en forkconsistentie
        run: python tools/jelly-leon/check_fork_consistency.py

      - name: Patchregister (elke core-patch geregistreerd)
        run: python tools/jelly-leon/patch_register_check.py

      # Contract 1.2 (A1): de kopieën zijn byte-gelijk aan lvos04/ai-server-manager op de vastgezette bron-commit
      # (publieke repo, geen token). Is de bron daarna gewijzigd, dan alleen een waarschuwing (overnemen = orkestratie).
      - name: Platformcontract-kopie (drifttest tegen de bron)
        run: python tools/jelly-leon/contract_drift.py --online --github

      - name: Tests van de forktools (incl. EX48-simulatie)
        run: python -m pytest -q tools/jelly-leon/tests

      - name: Lint forktools (ruff)
        run: ruff check --config tools/jelly-leon/ruff.toml tools/jelly-leon

      - name: Entrypoint controleren (shellcheck)
        run: shellcheck -s sh deploy/allinone/entrypoint.sh

      - name: Workflows controleren (actionlint met shellcheck)
        run: actionlint .github/workflows/jelly-leon-ci.yml .github/workflows/upstream-sync.yml

  # Contract 1.2 §9 (JL2): het manifest wordt gevalideerd door de validator van de manifesteigenaar (appstore-en-fork,
  # B08-001) — niet gekopieerd, maar uit de publieke repo op een vastgezette commit (alleen lezen, geen token nodig).
  # Alleen de waarschuwing digest_pending_release mag (nog geen release); vervallen velden tellen als fout.
  manifest:
    name: Manifest §9 (validator van appstore-en-fork, vastgezette commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APPSTORE_REPO: lvos04/appstore-en-fork
      APPSTORE_COMMIT: bd33052cd0174be08fbf6324f1caf296257182d3
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Validator ophalen (publieke repo, vastgezette commit)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ env.APPSTORE_REPO }}
          ref: ${{ env.APPSTORE_COMMIT }}
          path: _extern/appstore-en-fork
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Afhankelijkheden van de validator (hash-gepinde lockfile van de eigenaar)
        run: >
          python -m pip install --disable-pip-version-check --require-hashes --no-deps
          -r _extern/appstore-en-fork/apps/api/requirements.lock

      - name: Manifest valideren en beoordelen
        env:
          PYTHONPATH: _extern/appstore-en-fork/apps/api/src
        run: |
          set +e
          python -m appstore.manifest.cli validate deploy/manifest/jelly-leon.manifest.yaml --format json \
            > "$RUNNER_TEMP/manifest-rapport.json"
          echo "exitcode validator (zonder --strict): $?"
          set -e
          python tools/jelly-leon/manifest_rapport.py --rapport "$RUNNER_TEMP/manifest-rapport.json" --github

      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: manifest-rapport
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ runner.temp }}/manifest-rapport.json

  server:
    name: Upstream-solution bouwen en testen
    needs: forkregels
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # global.json (upstream) vraagt 9.0.0 + rollForward; die exacte versie is niet te downloaden. Daarom het kanaal
      # x.y.x uit global.json afleiden (zoals upstream zelf 9.0.x installeert); global.json blijft ongewijzigd.
      - name: .NET-SDK-kanaal uit global.json
        id: sdk
        run: python3 tools/jelly-leon/dotnet_sdk_kanaal.py --github-output

      - name: .NET SDK (actuele patch van de reeks uit global.json)
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: ${{ steps.sdk.outputs.kanaal }}

      - name: Gekozen SDK (via global.json/rollForward)
        run: dotnet --version

      - name: Restore
        run: dotnet restore Jellyfin.sln

      - name: Build (Release)
        run: dotnet build Jellyfin.sln -c Release --no-restore

      - name: Test (volledige upstream-testsuite)
        run: >
          dotnet test Jellyfin.sln -c Release --no-build --verbosity minimal
          --logger "trx;LogFilePrefix=jelly-leon" --results-directory testresults

      # Structureel vergelijken: upstream laadt XML-docbestanden in bestandssysteemvolgorde, waardoor alleen
      # description-teksten per omgeving kunnen verschillen (ADR-0010). Elke andere afwijking = API-wijziging = falen.
      - name: OpenAPI-drift (upstream-API moet gelijk blijven aan docs/openapi)
        run: |
          generated=$(find tests/Jellyfin.Server.Integration.Tests/bin/Release -name openapi.json | head -1)
          python3 tools/jelly-leon/openapi_drift.py --github \
            --verwacht docs/openapi/jelly-leon.openapi.json --gegenereerd "${generated:-ontbreekt/openapi.json}"

      - name: Testresultaten bewaren
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: testresultaten-server
          retention-days: 14
          path: testresults/

  plugins:
    name: Plugins bouwen en testen
    needs: forkregels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # global.json (upstream) vraagt 9.0.0 + rollForward; die exacte versie is niet te downloaden. Daarom het kanaal
      # x.y.x uit global.json afleiden (zoals upstream zelf 9.0.x installeert); global.json blijft ongewijzigd.
      - name: .NET-SDK-kanaal uit global.json
        id: sdk
        run: python3 tools/jelly-leon/dotnet_sdk_kanaal.py --github-output

      - name: .NET SDK (actuele patch van de reeks uit global.json)
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: ${{ steps.sdk.outputs.kanaal }}

      - name: Gekozen SDK (via global.json/rollForward)
        run: dotnet --version

      - name: Build plugins (tegen Jellyfin.Controller van de basisversie)
        run: dotnet build plugins/JellyLeon.Plugins.sln -c Release

      - name: Test plugins
        run: dotnet test plugins/JellyLeon.Plugins.sln -c Release --no-build --verbosity minimal

      - name: Plugin-DLL bewaren
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: plugin-jellyleon
          retention-days: 14
          if-no-files-found: error
          path: plugins/JellyLeon/src/Jellyfin.Plugin.JellyLeon/bin/Release/net9.0/Jellyfin.Plugin.JellyLeon.dll

  image:
    name: Alles-in-één image bouwen (echte jelly-leon-web-build) en levenscyclus testen
    needs: forkregels
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # lvos04/jelly-leon-web is sinds 2026-11-09 publiek: de job bouwt de web-client echt uit de fork (stage `web` van
      # de productie-Dockerfile: npm ci + webpack-productiebuild), op de vaste commit baseline.json web_fork_commit —
      # geen zwevende branch, geen token. Server, plugin, entrypoint en healthcheck komen uit deze checkout.
      - name: Web-bron uit baseline.json
        id: web
        run: python3 tools/jelly-leon/web_bron.py --commit --github-output

      - name: jelly-leon-web ophalen (publiek, vaste commit, historie zonder blobs)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ steps.web.outputs.repo }}
          ref: ${{ steps.web.outputs.commit }}
          path: _extern/jelly-leon-web
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Web-bron controleren (commit, jellyfin-web-versie = server-basis, upstream-basis is voorouder)
        run: python3 tools/jelly-leon/web_bron.py --controleer _extern/jelly-leon-web

      - name: Schone export van jelly-leon-web (git archive; geen .git of bouwresten in de build-context)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jelly-leon-web"
          git -C _extern/jelly-leon-web archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/jelly-leon-web"
          test -f "$RUNNER_TEMP/jelly-leon-web/package-lock.json"
          rm -rf _extern

      - name: Image bouwen met de productie-Dockerfile (geen push)
        env:
          WEB_REF: ${{ steps.web.outputs.commit }}
        run: |
          set -eu
          fork_version=$(python3 -c "import json;print(json.load(open('tools/jelly-leon/baseline.json'))['fork_version'])")
          docker buildx build -f deploy/allinone/Dockerfile \
            --build-context jelly-leon-web="$RUNNER_TEMP/jelly-leon-web" \
            --build-arg FORK_VERSION="$fork_version" --build-arg VCS_REF="$GITHUB_SHA" --build-arg WEB_REF="$WEB_REF" \
            --build-arg BUILD_JOBS=4 --load -t jelly-leon:ci .

      - name: Levenscyclustest (lege opslag, healthy, elk proces 568, herkomst web, herstart, Custom User, weigeringen)
        env:
          WEB_REF: ${{ steps.web.outputs.commit }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('tools/jelly-leon/baseline.json'))['upstream_version'])")
          python3 tools/jelly-leon/e2e/image_lifecycle.py --image jelly-leon:ci --expected-version "$version" \
            --werkmap "$RUNNER_TEMP" --report "$RUNNER_TEMP/image-lifecycle.json" --verwacht-web-ref "$WEB_REF" \
            --opmerking "CI; web-client gebouwd uit lvos04/jelly-leon-web@$WEB_REF"

      # B03-013: migratie vanaf de bestaande upstream-Jellyfin en terug met DB-back-up (koude kopie als model voor de
      # ZFS-snapshot) + oude binary; streamen moet blijven werken. Upstream-image = de vastgezette runtime (digest).
      - name: Terugzetproef (upstream → Jelly Leon → terug met DB-back-up en oude binary)
        run: |
          version=$(python3 -c "import json;print(json.load(open('tools/jelly-leon/baseline.json'))['upstream_version'])")
          python3 tools/jelly-leon/e2e/rollback_sim.py --image jelly-leon:ci --upstream-image "$JL_RUNTIME_IMAGE" \
            --expected-version "$version" --werkmap "$RUNNER_TEMP" --report "$RUNNER_TEMP/rollback-sim.json" \
            --opmerking "CI; Jelly Leon-image met de echte web-build van jelly-leon-web"

      - name: Rapporten bewaren
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: image-lifecycle
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/image-lifecycle.json
            ${{ runner.temp }}/rollback-sim.json

  stock-client-e2e:
    name: Stock-client-smoketest (simulator, geen echte apparaten)
    needs: [server, plugins]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # global.json (upstream) vraagt 9.0.0 + rollForward; die exacte versie is niet te downloaden. Daarom het kanaal
      # x.y.x uit global.json afleiden (zoals upstream zelf 9.0.x installeert); global.json blijft ongewijzigd.
      - name: .NET-SDK-kanaal uit global.json
        id: sdk
        run: python3 tools/jelly-leon/dotnet_sdk_kanaal.py --github-output

      - name: .NET SDK (actuele patch van de reeks uit global.json)
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: ${{ steps.sdk.outputs.kanaal }}

      - name: Gekozen SDK (via global.json/rollForward)
        run: dotnet --version

      - name: Server publiceren (self-contained, linux-x64)
        run: >
          dotnet publish Jellyfin.Server/Jellyfin.Server.csproj -c Release --runtime linux-x64 --self-contained
          -p:DebugSymbols=false -p:DebugType=none -o "$RUNNER_TEMP/server"

      - name: Plugin bouwen
        run: dotnet build plugins/JellyLeon/src/Jellyfin.Plugin.JellyLeon/Jellyfin.Plugin.JellyLeon.csproj -c Release

      - name: Server starten op de upstream-runtime (als 568, zonder capabilities)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/config/plugins/JellyLeon_0.1.0.0" "$RUNNER_TEMP/cache" "$RUNNER_TEMP/media"
          cp plugins/JellyLeon/src/Jellyfin.Plugin.JellyLeon/bin/Release/net9.0/Jellyfin.Plugin.JellyLeon.dll \
             "$RUNNER_TEMP/config/plugins/JellyLeon_0.1.0.0/"
          python3 tools/jelly-leon/e2e/make_test_media.py "$RUNNER_TEMP/media"
          sudo chown -R 568:568 "$RUNNER_TEMP/config" "$RUNNER_TEMP/cache"
          docker run -d --name jl-e2e --user 568:568 --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:38096:8096 \
            -v "$RUNNER_TEMP/server:/jellyfin:ro" -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/cache:/cache" \
            -v "$RUNNER_TEMP/media:/media/muziek:ro" \
            "$JL_RUNTIME_IMAGE" --nowebclient

      - name: Stock-client-smoketest
        run: |
          version=$(python3 -c "import json;print(json.load(open('tools/jelly-leon/baseline.json'))['upstream_version'])")
          python3 tools/jelly-leon/e2e/stock_client_smoke.py --url http://127.0.0.1:38096 \
            --expected-version "$version" --library-path /media/muziek --expect-plugin \
            --media-file "$RUNNER_TEMP/media/Jelly Leon Test/Smoketest/01 - Sinus 440 Hz.wav" \
            --report "$RUNNER_TEMP/stock-client-smoke.json"

      - name: Serverlog bij falen
        if: failure()
        run: docker logs jl-e2e 2>&1 | tail -200

      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: stock-client-smoke
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ runner.temp }}/stock-client-smoke.json
